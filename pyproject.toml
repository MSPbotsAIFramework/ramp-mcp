[project]
name = "ramp-mcp"
version = "0.1.0"
description = "MCP server for Ramp (expense and corporate-card platform)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
]

[project.scripts]
ramp-mcp = "ramp_mcp.__main__:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
